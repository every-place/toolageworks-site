# Cloudflare Worker with static assets. The website is in public/, the API in src/ and lib/.
name = "toolageworks-site"
main = "src/worker.js"
workers_dev = true     # keep the free .workers.dev link as a backup address
preview_urls = true
compatibility_date = "2026-10-01"

# Serve the site on the real domain. Cloudflare creates the DNS records and HTTPS certificate.
routes = [
  { pattern = "toolageworks.com", custom_domain = true },
  { pattern = "www.toolageworks.com", custom_domain = true },
]

# Keep logs so errors (like a failed Zoho copy) show up under the worker's Observability tab.
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
# Which database the API uses: "d1", "zoho", or "memory" (local testing only).
DATA_BACKEND = "d1+zoho"
ZOHO_DC = "com"
ZOHO_OWNER = "toolageworks"
ZOHO_APP = "toolage-works"
ZOHO_LEAD_FORM = "Lead"

# Contact form messages are stored here (table: leads, see db/schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "toolageworks"
database_id = "78f09abd-f724-45d0-ae61-ed221949aa01"
